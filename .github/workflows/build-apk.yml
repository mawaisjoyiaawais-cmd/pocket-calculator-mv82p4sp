name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python code
        run: |
          python -m py_compile $(git ls-files '*.py')
          echo "Python code OK"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.36" "setuptools<70" virtualenv
      - name: Build APK
        run: buildozer -v android debug
      - name: Rename APK
        run: |
          mkdir -p out
          cp bin/*.apk out/app.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: out/app.apk
          make_latest: true
